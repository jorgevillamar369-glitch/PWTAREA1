
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - Formulario de Registro</title>

    <style>
        body {
            background:linear-gradient( lightblue 60%,#d45b91  );
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #d45b91;
        }

        h2 {
            color: #d45b91;
        }

        form {
            background-color: white;
            width: 350px;
            max-width: 90%;
            margin: 25px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #888888;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            color: #333333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: white;
        }

        button {
            background-color: #f8bbd0;
            color: #333333;
            padding: 12px 25px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #ec80ad;
            color: white;
        }

        #mensaje {
            color: green;
            font-weight: bold;
        }

        a {
            color: #b83280;
            font-size: 18px;
        }

        .integrantes {
            background-color: #ffffff;
            max-width: 400px;
            margin: 25px auto;
            padding: 15px;
            border-radius: 12px;
        }
        html, body{
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>

<body>

    <h1>Formulario de Registro</h1>

    <p>Ejercicio 4 - Programación Web Avanzada</p>

    <form id="formulario">

        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre"
               name="nombre" required>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo"
               name="correo" required>

        <label for="edad">Edad:</label>
        <input type="number" id="edad"
               name="edad" min="1" required>

        <label for="integrante">
            Integrante del grupo:
        </label>

        <select id="integrante"
                name="integrante" required>

            <option value="">
                Seleccione un integrante
            </option>

            <option>Jorge Villamar</option>
            <option>Norka Mideros</option>
            <option>Liseth Criollo</option>
            <option>Mauri Chinlle</option>
            <option>Bruce Balarezo</option>

        </select>

        <button type="submit">
            Enviar Registro
        </button>

        <p id="mensaje" role="status"></p>

    </form>

    <div class="integrantes">

        <h2>Integrantes del Grupo</h2>

        <p>Jorge Villamar</p>
        <p>Norka Mideros</p>
        <p>Liseth Criollo</p>
        <p>Mauri Chinlle</p>
        <p>Bruce Balarezo</p>

    </div>

    <a href="index.html">
        Volver al inicio
    </a>

    <script>
        document.getElementById("formulario")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let nombre = document.getElementById("nombre").value;

                document.getElementById("mensaje")
                    .textContent =
                    "¡Registro realizado correctamente, "
                    + nombre + "!";

            });
    </script>

</body>
</html>
